<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <script src="/docs/5.3/assets/js/color-modes.js"></script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/sign-in/">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">

    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--For header-->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" href="assets/logo-small.svg" type="image/svg+xml">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#712cf9">

</head>

<body>
    <!-- The main header -->
    <header class="py-3 custom-bg border-bottom">
        <div class="container d-flex flex-wrap justify-content-center">
            <a href="/" class="d-flex align-items-center mb-3 mb-lg-0 me-lg-auto link-body-emphasis text-decoration-none">
                <img src="images/logo.png" alt="Logo" height="150px">
            </a>
        </div>
    </header>

    <!-- Form begins -->
    <div class="container">
        <form class="row g-3">
            <!-- General Information Section -->
            <div class="col-12">
                <h3>General Information</h3>
            </div>
            <div class="col-12">
                <div class="form-floating">
                    <input type="text" class="form-control" id="floatingInputGrid" placeholder="Name">
                    <label for="floatingInputGrid">Name</label>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-floating">
                    <input type="text" class="form-control" id="floatingInputGrid" placeholder="Father's Name">
                    <label for="floatingInputGrid">Father's Name</label>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-floating">
                    <input type="text" class="form-control" id="floatingInputGrid" placeholder="Mother's Name">
                    <label for="floatingInputGrid">Mother's Name</label>
                </div>
            </div>
    
            <!-- Contact Details Section -->
            <div class="col-12">
                <h3>Contact Details</h3>
            </div>
            <div class="col-md-6">
                <div class="form-floating">
                    <input type="tel" class="form-control" id="inputMobile" placeholder="Enter your mobile number">
                    <label for="inputMobile">Mobile Number</label>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-floating">
                    <input type="email" class="form-control" id="inputEmail4" placeholder="Enter your email ID">
                    <label for="inputEmail4">Email</label>
                </div>
            </div>
            <div class="col-12">
                <div class="form-floating">
                    <input type="text" class="form-control" id="inputAddress" placeholder="Enter your address">
                    <label for="inputAddress">Address</label>
                </div>
            </div>
    
            <!-- Land Details Section -->
            <div class="col-12">
                <h3>Land Details (in acres)</h3>
            </div>
            <div class="row g-2">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="floatingInputGrid" placeholder="Total Land Available">
                        <label for="floatingInputGrid">Total Land Available</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="floatingInputGrid" placeholder="Land Owned">
                        <label for="floatingSelectGrid">Land Owned</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="floatingInputGrid" placeholder="Land Contracted">
                        <label for="floatingSelectGrid">Land Contracted</label>
                    </div>
                </div>
            </div>
    
            <!-- Certifications Section -->
            <div class="col-12">
                <h3>Certifications</h3>
            </div>
            <label for="certificationOptions" class="form-label">Which of the following certifications do you have?</label>
            <div class="form-check col-md-6">
                <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    NPOP Certification
                </label>
            </div>
            <div class="form-check col-md-6">
                <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked">
                <label class="form-check-label" for="flexCheckChecked">
                    USDA Organic
                </label>
            </div>
            <div class="form-check col-md-2" style="margin-right: 0">
                <input class="form-check-input" type="checkbox" value="" id="certificationCheck" onclick="toggleCertificationInput()">
                <label class="form-check-label" for="certificationCheck">
                    Other Certification
                </label>
            </div>
            <div class="col-md-3" id="certificationInput" style="display: none; margin-top: 10px;">
                <input type="text" class="form-control" id="certificationName" placeholder="Certification Name">
            </div>
            <div class="mb-3">
                <label for="formFileMultiple" class="form-label">Upload your organic farming certifications here</label>
                <input class="form-control" type="file" id="formFileMultiple" multiple>
            </div>
        </form>
    </div>
    
    </div>
    <script>
        function toggleCertificationInput() {
            const checkbox = document.getElementById('certificationCheck');
            const inputField = document.getElementById('certificationInput');
            if (checkbox.checked) {
                inputField.style.display = 'block';
            } else {
                inputField.style.display = 'none';
            }
        }
    </script>
</body>
</html>
