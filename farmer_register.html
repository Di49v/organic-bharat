<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <script src="/docs/5.3/assets/js/color-modes.js"></script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/sign-in/">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">

    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--For header-->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" href="assets/logo-small.svg" type="image/svg+xml">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#712cf9">

</head>

<body>
    <!-- The main header -->
    <header class="py-3 custom-bg border-bottom">
        <div class="container d-flex flex-wrap justify-content-center">
            <a href="/" class="d-flex align-items-center mb-3 mb-lg-0 me-lg-auto link-body-emphasis text-decoration-none">
                <img src="images/logo.png" alt="Logo" height="150px">
            </a>
        </div>
    </header>
    
<!-- Form begins -->
<div class="container py-5">
    <form class="row gy-4">
        <!-- General Information Section -->
        <div class="col-12">
            <h3 class="border-bottom pb-2">General Information</h3>
        </div>
        <div class="col-12">
            <label for="nameInput" class="form-label">Name</label>
            <input type="text" class="form-control" id="nameInput" placeholder="Enter your name">
        </div>
        <div class="col-md-6">
            <label for="fatherNameInput" class="form-label">Father's Name</label>
            <input type="text" class="form-control" id="fatherNameInput" placeholder="Enter your father's name">
        </div>
        <div class="col-md-6">
            <label for="motherNameInput" class="form-label">Mother's Name</label>
            <input type="text" class="form-control" id="motherNameInput" placeholder="Enter your mother's name">
        </div>
        <div class="col-md-6">
            <label for="dobInput" class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="dobInput">
        </div>

        <!-- Contact Details Section -->
        <div class="col-12">
            <h3 class="border-bottom pb-2">Contact Details</h3>
        </div>
        <div class="col-md-6">
            <label for="mobileInput" class="form-label">Mobile Number</label>
            <input type="tel" class="form-control" id="mobileInput" placeholder="Enter your mobile number">
        </div>
        <div class="col-md-6">
            <label for="emailInput" class="form-label">Email</label>
            <input type="email" class="form-control" id="emailInput" placeholder="Enter your email">
        </div>
        <div class="col-12">
            <label for="addressInput" class="form-label">Address</label>
            <textarea class="form-control" id="addressInput" rows="3" placeholder="Enter your address"></textarea>
        </div>

        <!-- Land Details Section -->
        <div class="col-12">
            <h3 class="border-bottom pb-2">Land Details (in acres)</h3>
        </div>
        <div class="col-md-6">
            <label for="totalLandInput" class="form-label">Total Land Available</label>
            <input type="number" class="form-control" id="totalLandInput" placeholder="Enter total land available">
        </div>
        <div class="col-md-3">
            <label for="landOwnedInput" class="form-label">Land Owned</label>
            <input type="number" class="form-control" id="landOwnedInput" placeholder="Enter land owned">
        </div>
        <div class="col-md-3">
            <label for="landContractedInput" class="form-label">Land Contracted</label>
            <input type="number" class="form-control" id="landContractedInput" placeholder="Enter land contracted">
        </div>

        <!-- Certifications Section -->
        <div class="col-12">
            <h3 class="border-bottom pb-2">Certifications</h3>
        </div>
        <div class="col-12">
            <label class="form-label">Certifications you have:</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="npopCertification">
                <label class="form-check-label" for="npopCertification">NPOP Certification</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="usdaCertification">
                <label class="form-check-label" for="usdaCertification">USDA Organic</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="otherCertification" onclick="toggleCertificationInput()">
                <label class="form-check-label" for="otherCertification">Other Certification</label>
            </div>
            <div id="certificationInputWrapper" class="mt-3 d-none">
                <label for="otherCertificationInput" class="form-label">Certification Name</label>
                <input type="text" class="form-control" id="otherCertificationInput" placeholder="Enter certification name">
            </div>
        </div>
        <div class="col-12">
            <label for="certificationFileInput" class="form-label">Upload Certifications</label>
            <input class="form-control" type="file" id="certificationFileInput" multiple>
        </div>
    </form>
</div>

<script>
    function toggleCertificationInput() {
        const inputWrapper = document.getElementById('certificationInputWrapper');
        inputWrapper.classList.toggle('d-none');
    }
</script>

</body>
</html>
