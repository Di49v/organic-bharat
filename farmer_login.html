<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <script src="/docs/5.3/assets/js/color-modes.js"></script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/sign-in/">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">

    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--For header-->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" href="assets/logo-small.svg" type="image/svg+xml">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#712cf9">

</head>

<body>
    <!-- The main header -->
    <header class="py-3 custom-bg border-bottom">
        <div class="container d-flex flex-wrap justify-content-center">
            <a href="/" class="d-flex align-items-center mb-3 mb-lg-0 me-lg-auto link-body-emphasis text-decoration-none">
                <img src="images/logo.png" alt="Logo" height="150px">
            </a>
        </div>
    </header>

    <main class="container-fluid vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 shadow-lg rounded">
            <!-- Side image -->
            <div class="col-md-6 d-none d-md-flex justify-content-center align-items-center bg-light">
                <img src="farmer_login_images/Login_side.svg" class="img-fluid">
            </div>
            <!-- Login form -->
            <div class="col-md-6 d-flex flex-column justify-content-center align-items-center p-4" style="background-color: rgb(237, 235, 235);">
                <div class="w-100">
                    <form class="row g-4">
                        <!-- Logo -->
                        <div class="text-center mb-3">
                            <img src="images/logo.svg" class="img-fluid" style="max-width: 200px;">
                        </div>
                        <h3 class="text-center fw-bold">Login/Sign up</h3>
                        <!-- Phone number input -->
                        <div class="col-12">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="phoneNumber" placeholder="Phone number">
                                <label for="phoneNumber">Phone number</label>
                            </div>
                        </div>
                        <!-- Get OTP button -->
                        <div class="col-12">
                            <button class="btn btn-primary w-100" type="button">Get OTP</button>
                        </div>
                        <!-- Google sign-in -->
                        <div class="col-12">
                            <button class="btn btn-outline-primary w-100" type="button">Sign in with Google</button>
                        </div>
                        <!-- Facebook sign-in -->
                        <div class="col-12">
                            <button class="btn btn-outline-primary w-100" type="button">Sign in with Facebook</button>
                        </div>
                        <!-- Signup prompt -->
                        <div class="col-12 text-center mt-3">
                            <p class="mb-0">Don't have an account? <a href="#" class="text-primary text-decoration-none">Sign up</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    
    
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
