<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <script src="/docs/5.3/assets/js/color-modes.js"></script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/sign-in/">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">

    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--For header-->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" href="assets/logo-small.svg" type="image/svg+xml">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#712cf9">

</head>

<body>
    <!-- The main header -->
    <header class="py-3 custom-bg border-bottom">
        <div class="container d-flex flex-wrap justify-content-center">
            <a href="/" class="d-flex align-items-center mb-3 mb-lg-0 me-lg-auto link-body-emphasis text-decoration-none">
                <img src="images/logo.png" alt="Logo" height="150px">
            </a>
        </div>
    </header>

    <main class="form-signin w-100 m-auto row align-items-center py-4">
        <!-- Side image -->
        <div class="col-md-6">
            <img src="farmer_login_images/Login_side.svg" class="img-fluid">
        </div>
        <!-- Login form -->
        <div class="col-md-6">
            <div class="container w-75" style="background-color: lightgray;">
                <form class="row g-3">
                    <div class="d-flex justify-content-center align-items-center">
                        <img src="images/Logo.svg" class="img-fluid w-25">
                    </div>
                    <h3 class="h3 mb-3 fw-normal text-center">Login/Sign up</h3>
                    <div class="col-12">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="phoneNumber" placeholder="Phone number">
                            <label for="phoneNumber">Phone number</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary w-100" type="button">Get OTP</button>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-outline-primary w-100" type="button">Sign in with Google</button>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-outline-primary w-100" type="button">Sign in with Facebook</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
